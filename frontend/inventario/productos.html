<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventario | Luna ERP</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/inventario.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Contenido -->
    <main class="main">

        <!-- Header -->
        <div id="header-container"></div>

        <div class="page">

            <!-- Encabezado -->

            <section class="page-header">

                <div>

                    <h1>Inventario</h1>

                    <p>
                        Administra todos los productos y controla el stock.
                    </p>

                </div>

                <button
                    class="btn btn-primary"
                    onclick="abrirFormulario()">

                    <i class="bi bi-plus-circle"></i>

                    Nuevo Producto

                </button>

            </section>

            <!-- Barra de búsqueda -->

            <section class="toolbar">

                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        id="buscarProducto"
                        type="text"
                        placeholder="Buscar producto...">

                </div>

            </section>

            <!-- Tabla -->

            <section class="card">

                <div class="table-container">

                    <table>

                        <thead>

                        <tr>

                            <th>ID</th>

                            <th>Producto</th>

                            <th>Precio</th>

                            <th>Stock</th>

                            <th>Estado</th>

                            <th>Stock mínimo</th>

                            <th style="width:160px">

                                Acciones

                            </th>

                        </tr>

                        </thead>

                        <tbody id="tablaProductos">

                        </tbody>

                    </table>

                </div>

            </section>

            <!-- AQUÍ irán los modales -->
             <!-- ==========================================
     MODAL NUEVO PRODUCTO
========================================== -->

<div id="modalProducto" class="modal">

    <div class="modal-content modal-lg">

        <div class="modal-header">

            <h2>Nuevo Producto</h2>

            <button
                class="modal-close"
                onclick="cerrarFormulario()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Código de Barras</label>
                <input id="codigoProducto" type="text">
            </div>

            <div class="form-group">
                <label>Nombre</label>
                <input id="nombreProducto" type="text">
            </div>

            <div class="form-group">
                <label>Precio Compra</label>
                <input id="precioCompraProducto" type="number">
            </div>

            <div class="form-group">
                <label>Precio Venta</label>
                <input id="precioVentaProducto" type="number">
            </div>

            <div class="form-group">
                <label>Stock Inicial</label>
                <input id="stockProducto" type="number">
            </div>

            <div class="form-group">
                <label>Stock Mínimo</label>
                <input id="stockMinimoProducto" type="number">
            </div>

            <div class="form-group">

                <label>Unidad</label>

                <select id="unidadProducto">

                    <option value="unidad">Unidad</option>
                    <option value="kg">Kilogramos</option>

                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn"
                onclick="cerrarFormulario()">

                Cancelar

            </button>

            <button
                class="btn btn-primary"
                onclick="guardarProducto()">

                Guardar Producto

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     MODAL EDITAR PRODUCTO
========================================== -->

<div id="modalEditarProducto" class="modal">

    <div class="modal-content modal-lg">

        <input type="hidden" id="editarId">

        <div class="modal-header">

            <h2>Editar Producto</h2>

            <button
                class="modal-close"
                onclick="cerrarEditar()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Nombre Actual</label>
                <div id="actualNombre" class="campo-actual"></div>
            </div>

            <div class="form-group">
                <label>Nuevo Nombre</label>
                <input id="editarNombre">
            </div>

            <div class="form-group">
                <label>Precio Actual</label>
                <div id="actualPrecioVenta" class="campo-actual"></div>
            </div>

            <div class="form-group">
                <label>Nuevo Precio</label>
                <input id="editarPrecioVenta">
            </div>

            <div class="form-group">
                <label>Stock Actual</label>
                <div id="actualStock" class="campo-actual"></div>
            </div>

            <h3>Para cambiar usar configuración</h3>

            <div class="form-group">
                <label>Stock Mínimo Actual</label>
                <div id="actualStockminimo" class="campo-actual"></div>
            </div>

            <div class="form-group">
                <label>Nuevo Stock Mínimo</label>
                <input id="editarStockminimo" type="number">
            </div>


            <div class="form-group">
                <label>Unidad Actual</label>
                <div id="actualUnidad" class="campo-actual"></div>
            </div>

            <div class="form-group">

                <label>Nueva Unidad</label>

                <select id="editarUnidad">

                    <option value="unidad">Unidad</option>
                    <option value="kg">Kilogramos</option>

                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn"
                onclick="cerrarEditar()">

                Cancelar

            </button>

            <button
                class="btn btn-primary"
                onclick="actualizarProducto()">

                Guardar Cambios

            </button>

        </div>

    </div>

</div>

<!-- ==========================================
     MODAL AJUSTAR STOCK
========================================== -->

<div id="modalStock" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Ajustar Stock</h2>

            <button
                class="modal-close"
                onclick="cerrarModal()">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <div class="form-group">

            <label>Cantidad</label>

            <input
                id="cantidad"
                type="number">

        </div>

        <div class="form-group">

            <label>Motivo</label>

            <input
                id="motivo"
                type="text">

        </div>

        <div class="modal-footer">

            <button
                class="btn"
                onclick="cerrarModal()">

                Cancelar

            </button>

            <button
                class="btn btn-primary"
                onclick="guardarAjuste()">

                Guardar Ajuste

            </button>

        </div>

    </div>

</div>

        </div> <!-- page -->

    </main>

</div> <!-- layout -->

<script>
const BASE_PATH = "../";
</script>

<!-- COMPONENTES -->
<script src="../js/sidebar.js"></script>
<script src="../js/header.js"></script>

<!-- LÓGICA DEL MÓDULO -->
<script src="../js/productos.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

    cargarSidebar();

    cargarHeader("Inventario");

});

</script>

</body>
</html>
