<html>
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: monospace;
    width: 300px;
}

.center {
    text-align: center;
}
</style>
</head>
<body onload="window.print()">

<div class="center">
    <h3>MINIMERCADO</h3>
    <p>{{ venta.numero_ticket }}</p>
</div>

<hr>

{% for item in detalles %}
<p>
{{ item.producto.nombre }}<br>
{{ item.cantidad }} x Gs. {{ item.precio_venta }}
</p>
{% endfor %}

<hr>

<h3>Total: Gs. {{ venta.total }}</h3>

<p>Gracias por su compra</p>

</body>
</html>
