<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna ERP | Facturas emitidas</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/pages/libreta.css">
    <link rel="stylesheet" href="../css/luna-ui.css">
    <link rel="stylesheet" href="../css/pages/facturas.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="../js/api-config.js"></script>
    <script src="../js/luna-ui.js"></script>
</head>

<body>

<div id="sidebar-container"></div>

<main class="main">
<section class="page">

    <header class="facturas-cabecera">
        <img src="../img/logo_luna.svg" alt="Luna Minimarket" class="facturas-logo">
        <div class="facturas-titulo">
            <h1>Facturas emitidas</h1>
            <p>Consulta, verifica e imprime las facturas registradas. Exporta el libro de ventas para tu contador.</p>
        </div>
        <button type="button" class="luna-btn" id="btnExportar">
            <i class="bi bi-filetype-csv" aria-hidden="true"></i> Libro de ventas
        </button>
    </header>

    <div class="facturas-kpis">
        <div class="kpi-factura destacado">
            <span>Total facturado</span>
            <strong id="kpiTotal">Gs. 0</strong>
            <small id="kpiCantidad">0 facturas</small>
        </div>
        <div class="kpi-factura">
            <span>IVA 10 %</span>
            <strong id="kpiIva10">Gs. 0</strong>
        </div>
        <div class="kpi-factura">
            <span>IVA 5 %</span>
            <strong id="kpiIva5">Gs. 0</strong>
        </div>
        <div class="kpi-factura">
            <span>Exentas</span>
            <strong id="kpiExentas">Gs. 0</strong>
        </div>
        <div class="kpi-factura">
            <span>Anuladas</span>
            <strong id="kpiAnuladas">0</strong>
        </div>
    </div>

    <div class="card">
        <form class="facturas-filtros" id="filtrosFacturas">
            <label>Desde <input type="date" id="filtroDesde"></label>
            <label>Hasta <input type="date" id="filtroHasta"></label>
            <label class="ancho">Buscar
                <input type="search" id="filtroTexto" placeholder="N.º de factura, RUC, C.I. o cliente">
            </label>
            <label>Estado
                <select id="filtroEstado">
                    <option value="">Todas</option>
                    <option value="EMITIDA">Emitidas</option>
                    <option value="ANULADA">Anuladas</option>
                </select>
            </label>
            <label>Condición
                <select id="filtroCondicion">
                    <option value="">Todas</option>
                    <option value="CONTADO">Contado</option>
                    <option value="CREDITO">Crédito</option>
                </select>
            </label>
            <button type="submit" class="luna-btn primario"><i class="bi bi-search" aria-hidden="true"></i> Buscar</button>
        </form>

        <div class="table-container">
            <table class="tabla-libreta tabla-facturas">
                <thead>
                    <tr>
                        <th>Factura</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Condición</th>
                        <th class="r">IVA</th>
                        <th class="r">Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaFacturas">
                    <tr><td colspan="8" class="vacio">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</section>
</main>

<script>
const BASE_PATH = "../";
</script>
<script src="../js/sidebar.js"></script>
<script>
cargarSidebar();
</script>
<script src="../js/facturas.js"></script>
<script src="../js/enter-navigation.js"></script>
<script src="../js/responsive-tables.js"></script>

</body>
</html>
