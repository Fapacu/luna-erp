<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luna ERP | Historial de ventas</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/pages/libreta.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .filtros-ventas { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .filtros-ventas label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #4b5563; }
        .filtros-ventas input, .filtros-ventas select {
            padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; min-width: 140px;
        }
        .filtros-ventas button {
            padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff;
            font-weight: 600; cursor: pointer;
        }
        .estado-venta { font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 999px; }
        .estado-COMPLETADA { background: #dcfce7; color: #166534; }
        .estado-ANULADA { background: #fee2e2; color: #991b1b; }
        .acciones-venta { display: flex; gap: 6px; justify-content: center; }
        .acciones-venta button {
            width: 34px; height: 34px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        }
        .acciones-venta .btn-anular { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
        .acciones-venta .btn-ticket { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
        .acciones-venta .btn-factura { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }
        .acciones-venta .btn-facturar { color: #ea580c; border-color: #fed7aa; background: #fff7ed; }
        .modal-factura { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal-factura.abierto { display: flex; }
        .modal-factura form { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; }
        .modal-factura h2 { margin: 0 0 12px; font-size: 18px; }
        .modal-factura label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
        .modal-factura input, .modal-factura select { padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-weight: 400; }
        .modal-factura .botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
        .modal-factura .botones button { padding: 10px 16px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-weight: 600; }
        .modal-factura .botones .primario { background: #f97316; border-color: #f97316; color: #fff; }
        .modal-factura small { font-weight: 400; color: #6b7280; }
        .vacio { text-align: center; color: #6b7280; padding: 24px; }
    </style>

    <script src="../js/api-config.js"></script>
</head>

<body>

<div id="sidebar-container"></div>

<main class="main">

<section class="page">

    <div class="page-header">
        <div>
            <h1><i class="bi bi-receipt"></i> Historial de ventas</h1>
            <p>Consulte ventas, reimprima tickets y anule ventas (administración).</p>
        </div>
    </div>

    <div class="grid-kpis">
        <div class="kpi-card">
            <div class="kpi-icon"><i class="bi bi-receipt-cutoff"></i></div>
            <div><span>Ventas completadas</span><h2 id="kpiCantidad">0</h2></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon verde"><i class="bi bi-cash-stack"></i></div>
            <div><span>Total vendido</span><h2 id="kpiTotal">Gs. 0</h2></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon naranja"><i class="bi bi-x-octagon"></i></div>
            <div><span>Anuladas</span><h2 id="kpiAnuladas">0</h2></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <form class="filtros-ventas" id="filtrosVentas">
                <label>Desde <input type="date" id="filtroDesde"></label>
                <label>Hasta <input type="date" id="filtroHasta"></label>
                <label>Ticket o N.º <input type="search" id="filtroTexto" placeholder="TICKET-000123"></label>
                <label>Estado
                    <select id="filtroEstado">
                        <option value="">Todos</option>
                        <option value="COMPLETADA">Completadas</option>
                        <option value="ANULADA">Anuladas</option>
                    </select>
                </label>
                <button type="submit"><i class="bi bi-search"></i> Buscar</button>
            </form>
        </div>

        <div class="table-container">
            <table class="tabla-libreta">
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Fecha</th>
                        <th>Cajero</th>
                        <th>Caja</th>
                        <th>Pago</th>
                        <th>Total</th>
                        <th>Factura</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaVentas">
                    <tr><td colspan="9" class="vacio">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</section>

</main>

<div class="modal-factura" id="modalFactura" role="dialog" aria-modal="true" aria-labelledby="tituloModalFactura">
    <form id="formFacturaVenta" novalidate>
        <h2 id="tituloModalFactura">Emitir factura</h2>
        <p id="resumenVentaFactura"></p>
        <label>Tipo de documento
            <select id="hfTipoDoc">
                <option value="RUC">RUC</option>
                <option value="CI">Cédula de identidad</option>
                <option value="SIN_NOMBRE">Sin nombre (consumidor final)</option>
            </select>
        </label>
        <label id="hfGrupoDoc">RUC o C.I.
            <input id="hfDocumento" inputmode="numeric" autocomplete="off" placeholder="Ej.: 80012345-6">
            <small id="hfAyuda" aria-live="polite"></small>
        </label>
        <label id="hfGrupoNombre">Nombre o razón social
            <input id="hfRazonSocial" maxlength="200">
        </label>
        <label>Dirección <small>(opcional)</small><input id="hfDireccion" maxlength="250"></label>
        <label>Teléfono <small>(opcional)</small><input id="hfTelefono" maxlength="50"></label>
        <label>Correo <small>(opcional)</small><input id="hfEmail" type="email" maxlength="150"></label>
        <div class="botones">
            <button type="button" id="hfCancelar">Cancelar</button>
            <button type="submit" class="primario">Emitir factura</button>
        </div>
    </form>
</div>

<script>
const BASE_PATH = "../";
</script>
<script src="../js/sidebar.js"></script>
<script>
cargarSidebar();
</script>
<script src="../js/historial_ventas.js"></script>
<script src="../js/enter-navigation.js"></script>
<script src="../js/responsive-tables.js"></script>

</body>

</html>
