<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios | Luna ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/pages/usuarios.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="js/api-config.js"></script>
</head>
<body>

<div id="sidebar-container"></div>

<main class="main">
<div class="header">

    <h1>👤 Gestión de Usuarios</h1>

    <button onclick="abrirModal()">➕ Nuevo Usuario</button>

    <table class="tabla">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
    </table>

</div>


        <!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">

        <h3 id="tituloModal">Nuevo Usuario</h3>

        <input type="hidden" id="user_id">

        <input type="text" id="username" placeholder="Usuario">

        <input type="email" id="email" placeholder="Email">

        <input type="password" id="password" placeholder="Contraseña">

        <select id="role">
            <option value="1">Administrador</option>
            <option value="2">Cajero</option>
        </select>

        <label>
            <input type="checkbox" id="is_active" checked>
            Usuario Activo
        </label>

        <button id="btnGuardar" onclick="guardarUsuario()">
            Guardar
        </button>

        <button onclick="cerrarModal()">
            Cancelar
        </button>

    </div>
</div>

<!-- MODAL CAMBIAR PASSWORD -->
<div class="modal" id="modalPassword">

    <div class="modal-content">

        <h3>🔑 Cambiar Contraseña</h3>

        <input type="hidden" id="password_user_id">

        <input
            type="password"
            id="nueva_password"
            placeholder="Nueva contraseña"
        >

        <input
            type="password"
            id="confirmar_password"
            placeholder="Confirmar contraseña"
        >

        <label style="display:flex;align-items:center;gap:8px;">

            <input
                type="checkbox"
                id="mostrarPassword"
                onchange="mostrarPasswords()"
            >

            Mostrar contraseña

        </label>

        <div style="display:flex;gap:10px;justify-content:flex-end;">

            <button onclick="guardarPassword()">
                Guardar
            </button>

            <button onclick="cerrarModalPassword()">
                Cancelar
            </button>

        </div>

    </div>

</div>
</main>
<script>
    const BASE_PATH = "";
</script>

<script src="js/sidebar.js"></script>

<script>
    cargarSidebar();
</script>

<script src="js/usuarios.js"></script>
<script src="js/enter-navigation.js"></script>
<script src="js/responsive-tables.js"></script>
</body>
</html>
