<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title>Luna Minimarket</title>

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Segoe UI;
            background: #1e3a8a;
            color: white;

<body>

    <script>

        setTimeout(() => {

            const token = localStorage.getItem("token")

                window.location.href = "login.html"

            }

        }, 1000)

    </script>
