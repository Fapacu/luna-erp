<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar compra | Luna ERP</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/compras.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="../css/luna-ui.css">
<script src="../js/api-config.js"></script>
<script src="../js/luna-ui.js"></script>
</head>

<body class="registro-compra-page">

<div class="layout">

    <aside id="sidebar-container"></aside>

    <main class="main">

        <header id="header-container"></header>

        <section class="page">

            <!-- ==========================
                 ENCABEZADO
            =========================== -->

            <div class="page-header">

                <div>

                    <h1>
                        <i class="bi bi-cart-check"></i>
                        Registrar compra
                    </h1>

                    <p>
                        Carga una nueva compra y actualiza el inventario.
                    </p>

                </div>

                <a class="btn-primary btn-nueva-compra" href="compras.html"><i class="bi bi-clock-history"></i> Consultar compras</a>

            </div>


            <!-- ==========================
                 MODAL
            =========================== -->

            <div id="modalCompra" class="modal" style="display:flex">

                <div class="modal-content">

                    <div class="modal-header">

                        <div>

                            <h2>

                                <i class="bi bi-cart-plus"></i>

                                Nueva Compra

                            </h2>

                            <small>
                                Complete los datos de la compra.
                            </small>

                        </div>

                        <button
                            class="btn-close"
                            onclick="cerrarFormulario()">

                            <i class="bi bi-x-lg"></i>

                        </button>

                    </div>

                    <!-- ==========================
                        MODAL NUEVO PROVEEDOR
                    ========================== -->

                    <div id="modalProveedor" class="modal">

                        <div class="modal-content" style="max-width:500px;">

                            <div class="modal-header">

                                <h2>
                                    <i class="bi bi-truck"></i>
                                    Nuevo Proveedor
                                </h2>

                                <button
                                    class="btn-close"
                                    onclick="document.getElementById('modalProveedor').style.display='none'">

                                    <i class="bi bi-x-lg"></i>

                                </button>

                            </div>

                            <div class="modal-body">

                                <div class="form-group">

                                    <label>Nombre</label>

                                    <input
                                        type="text"
                                        id="nombreProveedor"
                                        placeholder="Nombre del proveedor">

                                </div>

                                <div class="form-group">

                                    <label>Teléfono</label>

                                    <input
                                        type="text"
                                        id="telefonoProveedor"
                                        placeholder="0981xxxxxx">

                                </div>

                                <div class="modal-actions">

                                    <button
                                        class="btn-secondary"
                                        onclick="document.getElementById('modalProveedor').style.display='none'">

                                        Cancelar

                                    </button>

                                    <button
                                        class="btn-primary"
                                        onclick="guardarProveedor()">

                                        Guardar

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- ==========================
                        MODAL NUEVO PRODUCTO
                    ========================== -->

                    <div id="modalProducto" class="modal">

                        <div class="modal-content" style="max-width:600px;">

                            <div class="modal-header">

                                <h2>
                                    <i class="bi bi-box-seam"></i>
                                    Nuevo Producto
                                </h2>

                                <button
                                    class="btn-close"
                                    onclick="document.getElementById('modalProducto').style.display='none'">

                                    <i class="bi bi-x-lg"></i>

                                </button>

                            </div>

                            <div class="modal-body">

                                <div class="grid-form">

                                    <div class="form-group">

                                        <label>Nombre</label>

                                        <input
                                            type="text"
                                            id="nuevoNombreProducto">

                                    </div>

                                    <div class="form-group">

                                        <label>Código de barras</label>

                                        <input
                                            type="text"
                                            id="nuevoCodigoBarra">

                                    </div>

                                    <div class="form-group">

                                        <label>Precio Compra</label>

                                        <input
                                            type="number"
                                            id="nuevoPrecioCompra"
                                            value="0">

                                    </div>

                                    <div class="form-group">

                                        <label>Precio Venta</label>

                                        <input
                                            type="number"
                                            id="nuevoPrecioVenta"
                                            value="0">

                                    </div>

                                    <div class="form-group">

                                        <label>Stock Inicial</label>

                                        <input
                                            type="number"
                                            id="nuevoStock"
                                            value="0">

                                    </div>

                                    <div class="form-group">

                                        <label>Stock Mínimo</label>

                                        <input
                                            type="number"
                                            id="nuevoStockMinimo"
                                            value="5">

                                    </div>

                                    <div class="form-group">

                                        <label>Unidad</label>

                                        <select id="nuevaUnidad">

                                            <option value="unidad">Unidad</option>
                                            <option value="kg">Kg</option>
                                            <option value="litro">Litro</option>
                                            <option value="metro">Metro</option>

                                        </select>

                                    </div>

                                    <div class="form-group">

                                        <label>Cantidad</label>

                                        <input
                                            type="number"
                                            id="nuevocantidad"
                                            value="1"
                                            min="1">

                                    </div>

                                </div>

                                <div class="modal-actions">

                                    <button
                                        class="btn-secondary"
                                        onclick="document.getElementById('modalProducto').style.display='none'">

                                        Cancelar

                                    </button>

                                    <button
                                        class="btn-primary"
                                        onclick="guardarNuevoProducto()">

                                        Guardar

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- =====================================
                         DATOS DE LA COMPRA
                    ====================================== -->

                    <div class="modal-body">

                        <div class="section">

                            <h3>
                                <i class="bi bi-file-earmark-text"></i>
                                Información General
                            </h3>

                            <div class="grid-form">

                                <div class="form-group">
                                    <label for="proveedorSelect">Proveedor</label>
                                    <select id="proveedorSelect">
                                        <option value="">Seleccione un proveedor</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="numeroFactura">N° Factura</label>
                                    <input
                                        type="text"
                                        id="numeroFactura"
                                        placeholder="001-001-0000001">
                                </div>

                                <div class="form-group">
                                    <label for="metodoPago">Método de Pago</label>

                                    <select id="metodoPago">

                                        <option value="CONTADO">
                                            Contado
                                        </option>

                                        <option value="CREDITO">
                                            Crédito
                                        </option>

                                    </select>

                                </div>

                                <div class="form-group">
                                    <label for="fechaVencimiento">
                                        Fecha de Vencimiento
                                    </label>

                                    <input
                                        type="date"
                                        id="fechaVencimiento">

                                </div>

                            </div>

                            <div class="form-group">

                                <label for="observacion">
                                    Observaciones
                                </label>

                                <textarea
                                    id="observacion"
                                    rows="3"
                                    placeholder="Escriba alguna observación..."></textarea>

                            </div>

                        </div>


                        <!-- =====================================
                             PRODUCTOS
                        ====================================== -->

                        <div class="section">

                            <div class="section-header">

                                <h3>

                                    <i class="bi bi-box-seam"></i>

                                    Productos

                                </h3>

                            </div>

                            <div class="search-product">

                                <label for="buscarProducto">
                                    Buscar Producto
                                </label>

                                <input
                                    type="text"
                                    id="buscarProducto"
                                    autocomplete="off"
                                    placeholder="Escriba el nombre del producto...">

                                <div id="sugerencias"></div>

                                <div id="productoNoExiste" style="display:none; margin-top:10px;">
                                    <button
                                        class="btn-primary"
                                        onclick="abrirNuevoProducto()">

                                        <i class="bi bi-plus-circle"></i>
                                        Crear producto
                                    </button>
                                </div>

                                <input
                                    type="hidden"
                                    id="productoSeleccionado">

                            </div>


                            <div class="grid-producto">

                                <div class="form-group">

                                    <label for="cantidad">
                                        Cantidad
                                    </label>

                                    <input
                                        type="number"
                                        id="cantidad"
                                        min="1">

                                </div>

                                <div class="form-group">

                                    <label for="costo">
                                        Costo Unitario
                                    </label>

                                    <input
                                        type="number"
                                        id="costo"
                                        min="0">

                                </div>

                                <div class="form-group btn-agregar-container">

                                    <button
                                        type="button"
                                        class="btn-primary"
                                        onclick="agregarProducto()">

                                        <i class="bi bi-plus-lg"></i>

                                        Agregar

                                    </button>

                                </div>

                            </div>


                            <div class="table-container detalle-table">

                                <table>

                                    <thead>

                                        <tr>

                                            <th>Producto</th>
                                            <th>Cantidad</th>
                                            <th>Costo</th>
                                            <th>Total</th>
                                            <th style="width:80px;">
                                                Acción
                                            </th>

                                        </tr>

                                    </thead>

                                    <tbody id="tablaDetalle">

                                    </tbody>

                                </table>

                            </div>

                        </div>


                        <!-- =====================================
                             TOTALES
                        ====================================== -->

                        <div class="section">

                            <h3>

                                <i class="bi bi-calculator"></i>

                                Totales

                            </h3>

                            <div class="totales-grid">

                                <div class="form-group">

                                    <label for="descuento">
                                        Descuento
                                    </label>

                                    <input
                                        type="number"
                                        id="descuento"
                                        value="0">

                                </div>

                                <div class="form-group">

                                    <label for="impuesto">
                                        Impuesto
                                    </label>

                                    <input
                                        type="number"
                                        id="impuesto"
                                        value="0">

                                </div>

                                <div class="total-card">

                                    <span>Total Compra</span>

                                    <h2>

                                        Gs.

                                        <span id="totalCompra">

                                            0

                                        </span>

                                    </h2>

                                </div>

                            </div>

                        </div>


                        <!-- =====================================
                             BOTONES
                        ====================================== -->

                        <div class="modal-actions">

                            <button
                                type="button"
                                class="btn-secondary"
                                onclick="cerrarFormulario()">

                                <i class="bi bi-x-circle"></i>

                                Cancelar

                            </button>

                            <button
                                type="button"
                                class="btn-primary"
                                onclick="guardarCompra()">

                                <i class="bi bi-check-circle"></i>

                                Guardar Compra

                            </button>

                        </div>

                    </div>
                                    </div> <!-- modal-body -->

            </div> <!-- modal-content -->

        </div> <!-- modalCompra -->



    </section>

</main>

</div> <!-- layout -->


<script>
    const BASE_PATH = "../";
    window.MODO_REGISTRO_COMPRA = true;
</script>

<script src="../js/sidebar.js"></script>
<script src="../js/header.js"></script>

<script>
    cargarSidebar();
    cargarHeader("Registrar compra");
</script>

<script src="../js/compras.js?v=2"></script>

<script src="../js/enter-navigation.js"></script>
<script src="../js/responsive-tables.js"></script>
</body>
</html>
