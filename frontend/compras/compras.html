<!DOCTYPE html>
<html lang="es">

<head>
<link rel="icon" type="image/svg+xml" href="../img/favicon.svg">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compras | Luna ERP</title>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/compras.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="../css/luna-ui.css">
<script src="../js/api-config.js"></script>
<script src="../js/luna-ui.js"></script>
</head>

<body>

<div class="layout">

    <aside id="sidebar-container"></aside>

    <main class="main">

        <header id="header-container"></header>

        <section class="page">

            <!-- ==========================
                 ENCABEZADO
            =========================== -->

            <div class="page-header">

                <div>

                    <h1>
                        <i class="bi bi-cart-check"></i>
                        Compras realizadas
                    </h1>

                    <p>
                        Consulta las compras registradas, sus facturas y detalles.
                    </p>

                </div>

                <a class="btn-primary btn-nueva-compra" href="registrar_compra.html"><i class="bi bi-plus-circle-fill"></i> Registrar compra</a>

            </div>


            <!-- ==========================
                    KPIs
            =========================== -->

            <div class="grid-kpis">

                <div class="kpi-card">

                    <div class="kpi-icon">
                        <i class="bi bi-cash-stack"></i>
                    </div>

                    <div>

                        <span>Total Compras</span>

                        <h2 id="kpiCompras">
                            Gs. 0
                        </h2>

                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-icon azul">
                        <i class="bi bi-receipt"></i>
                    </div>

                    <div>

                        <span>Facturas</span>

                        <h2 id="kpiFacturas">
                            0
                        </h2>

                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-icon rojo">
                        <i class="bi bi-credit-card"></i>
                    </div>

                    <div>

                        <span>Total Crédito</span>

                        <h2 id="kpiCredito">
                            Gs. 0
                        </h2>

                    </div>

                </div>

                <div class="kpi-card">

                    <div class="kpi-icon verde">
                        <i class="bi bi-graph-up-arrow"></i>
                    </div>

                    <div>

                        <span>Promedio</span>

                        <h2 id="kpiPromedio">
                            Gs. 0
                        </h2>

                    </div>

                </div>

            </div>


            <!-- ==========================
                 HISTORIAL
            =========================== -->

            <div class="card">

                <div class="card-header">

                    <div>

                        <h2>

                            <i class="bi bi-clock-history"></i>

                            Historial de Compras

                        </h2>

                        <small>
                            Últimas compras registradas
                        </small>

                    </div>

                    <div class="search-box">

                        <i class="bi bi-search"></i>

                        <input
                            type="text"
                            id="buscarCompra"
                            placeholder="Buscar compra...">

                    </div>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                        <tr>

                            <th>#</th>
                            <th>Factura</th>
                            <th>Proveedor</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Total</th>
                            <th style="width:120px;">
                                Acciones
                            </th>

                        </tr>

                        </thead>

                        <tbody id="tablaCompras">

                        </tbody>

                    </table>

                </div>

            </div>






    </section>

</main>

</div> <!-- layout -->


<script>
    const BASE_PATH = "../";
</script>

<script src="../js/sidebar.js"></script>
<script src="../js/header.js"></script>

<script>
    cargarSidebar();
    cargarHeader("Compras realizadas");
</script>

<script src="../js/compras.js?v=2"></script>

<script>
/* ==========================================
   BUSCADOR DEL HISTORIAL
   (No modifica compras.js)
========================================== */

document.addEventListener("DOMContentLoaded", () => {

    const buscador = document.getElementById("buscarCompra");

    if (!buscador) return;

    buscador.addEventListener("keyup", function () {

        const texto = this.value.toLowerCase();

        const filas = document.querySelectorAll("#tablaCompras tr");

        filas.forEach(fila => {

            fila.style.display =
                fila.innerText.toLowerCase().includes(texto)
                ? ""
                : "none";

        });

    });

});
</script>

<script src="../js/enter-navigation.js"></script>
<script src="../js/responsive-tables.js"></script>
</body>
</html>
